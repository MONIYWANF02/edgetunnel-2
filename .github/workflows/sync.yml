name: Auto Sync from Upstream

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小時自動同步一次
  workflow_dispatch: # 允許手動點擊觸發

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 設定同步來源（預設同步原作者 cmliu 的最新程式碼）
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main
          
          # 強制合併更新
          git merge upstream/main --allow-unrelated-histories -m "Chore: Auto sync from upstream" || git checkout upstream/main -- .
          
          git push origin main
