name: Auto Sync from Upstream

on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小時自動同步一次
  workflow_dispatch:       # 支持手動按鈕觸發

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. 抓取 cmliu 原作者最新代碼
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream
          
          # 2. 將所有檔案替換成原作者最新版，但保留我們自己的 .github 資料夾（避開安全攔截）
          git checkout upstream/main -- .
          git checkout HEAD -- .github
          
          # 3. 提交變更並推送到 edgetunnel-2
          git add .
          git diff-index --quiet HEAD || git commit -m "Chore: Auto sync code from upstream"
          git push origin main
